app:
  command_prefix: "/ai"
  index_command_prefix: "/ai build-index"
  max_input_characters: 1024
  log_level: "INFO"
  data_dir: "data"
  raw_dir: "data/raw"
  chunks_path: "data/chunks/chunks.jsonl"
  index_dir: "data/index"
  eval_dir: "data/eval"
  cache_dir: "data/cache"
  answer_record_log_path: "logs/answer_records.jsonl"
  source_max_count: 3
infrastructure:
  database:
    url: ""
    connect_timeout_seconds: 3.0
    application_name: "kumc-agent"
  redis:
    url: ""
    socket_timeout_seconds: 3.0
  object_storage:
    endpoint_url: ""
    bucket: ""
    region: "ap-northeast-1"
    access_key_id: ""
    secret_access_key: ""
    prefix: "kumc-agent"
    use_ssl: true
  migrations:
    directory: "infrastructure/migrations"
    table_name: "schema_migrations"
rag:
  fast_model_notice: "※負荷軽減のために軽量モードを使用しました。"
  answer_json_max_retries: 2
  prompt_texts:
    empty_context: "(コンテキストなし)"
    empty_history: "(履歴なし)"
    history_user_prefix: "ユーザー: "
    history_assistant_prefix: "アシスタント: "
    history_sources_label: "参照ソース:"
    gemini_header_chat_history: "# チャット履歴"
    gemini_header_retry_history: "# 再検索前の質問と回答"
    gemini_header_circle_info: "# サークルの基本情報"
    gemini_header_capabilities: "# チャットボット自身の機能情報"
    gemini_header_context: "# コンテキスト"
    gemini_header_output_format: "# 出力形式"
    gemini_header_instructions: "## 指示"
    gemini_header_question: "# ユーザーの質問"
  routing:
    enabled: true
    provider: "gemini"
    gemini_model: "gemini-2.5-flash-lite"
    prompt_name: "routing"
    tasks:
      target_model:
        provider: "gemini"
        gemini_model: "gemini-2.5-flash-lite"
        prompt_name: "routing_target_model"
      use_additional_memory:
        provider: "gemini"
        gemini_model: "gemini-2.5-flash-lite"
        prompt_name: "routing_use_additional_memory"
      include_capabilities_info:
        provider: "gemini"
        gemini_model: "gemini-2.5-flash-lite"
        prompt_name: "routing_include_capabilities_info"
      needs_additional_query:
        provider: "gemini"
        gemini_model: "gemini-2.5-flash-lite"
        prompt_name: "routing_needs_additional_query"
      additional_queries:
        provider: "gemini"
        gemini_model: "gemini-3.1-flash-lite-preview"
        prompt_name: "routing_additional_queries"
      material_names:
        provider: "gemini"
        gemini_model: "gemini-3.1-flash-lite-preview"
        prompt_name: "routing_material_names"
      recency_mode:
        provider: "gemini"
        gemini_model: "gemini-3.1-flash-lite-preview"
        prompt_name: "routing_recency_mode"
    temperature: 0.0
    max_new_tokens: 128
    max_retries: 1
    log_enabled: true
    material_search_max_names: 3
  history:
    enabled: true
    max_turns: 3
    prompt_default_turns: 0
    prompt_additional_turns: 3
    special_channel_history_limit: 30
    special_channel_names: ["kumc-agent"]
    special_channel_custom_instruction: ""
  generation:
    rag:
      provider: "gemini"
      gemini_model: "gemini-3-flash-preview"
      temperature: 0.0
      max_output_tokens: 8192
      thinking_level: "minimal"
      prompt_name: "answer_rag"
    no_rag:
      provider: "gemini"
      gemini_model: "gemini-2.5-flash-lite"
      temperature: 0.0
      max_output_tokens: 4096
      thinking_level: "minimal"
      prompt_name: "answer_no_rag"
indexing:
  chunking:
    first_recursive_chunk_size: 1024
    first_recursive_chunk_overlap: 128
    second_recursive_chunk_size: 384
    second_recursive_chunk_overlap: 64
    summary_characters: 200
    summary_batch_size: 2000
    summary_llm_provider: "gemini"
    summary_gemini_model: "gemini-2.5-flash-lite"
    summary_temperature: 0.0
    summary_max_output_tokens: 1024
    summary_thinking_level: "minimal"
  stages:
    second_recursive_enabled: true
    sparse_second_recursive_enabled: true
    summary_enabled: true
  refresh:
    clear_raw_data: false
    clear_first_recursive_chunk_data: false
    clear_second_recursive_chunk_data: false
    clear_summary_chunk_data: false
    update_raw_data: true
    update_first_recursive_chunk_data: true
    update_second_recursive_chunk_data: true
    update_sparse_second_recursive_chunk_data: true
    update_summary_chunk_data: true
ops:
  index_update_estimate_min_minutes: 30
  index_update_estimate_max_minutes: 60
  ragas_answer_generation_batch_size: 30
  ragas_batch_size: 1024
  ragas_max_workers: 64
  ragas_timeout_seconds: 180.0
  ragas_max_retries: 1
  ragas_answer_cache_enabled: false
  ragas_answer_cache_path: "data/eval/cache/ragas_answers.jsonl"
  ragas_disable_history_for_eval: true
  ragas_metrics:
    answer_relevancy_enabled: true
    faithfulness_enabled: true
    context_precision_enabled: true
    context_recall_enabled: true
  answer_record_log_enabled: true
  answer_record_log_path: "logs/answer_records.jsonl"
integrations:
  discord:
    bot_token: ""
  openclaw:
    enabled: true
    agent: "main"
    model: "openai/gpt-5.4"
    lite_agent: "lite"
    lite_model: "google/gemini-3-flash-preview"
    config_dir: "configs/openclaw"
  drive:
    folder_id: ""
    google_application_credentials: ""
    max_files: 0
    batch_size: 20
    download_max_retries: 3
    download_retry_initial_delay_seconds: 0.5
    download_retry_max_delay_seconds: 8.0
    download_retry_backoff_multiplier: 2.0
    pdf_ocr_model_path: "model/ocr/PaddlePaddle/PP-OCRv5_mobile"
  crafters_colony:
    author_url: ""
    max_pages: 100
    max_articles: 0
  notion:
    api_token: ""
    database_ids: []
  minecraft_wiki:
    page_titles: []
    api_url: "https://minecraft.wiki/api.php"
    page_url_base: "https://minecraft.wiki/w/"
    max_pages: 20
  openai_api_key: ""
  gemini_api_key: ""
  gemini_requests_per_minute: 1000
  gemini_embedding_requests_per_minute: 100
  gemini_summary_requests_per_minute: 2000
  gemini_ragas_requests_per_minute: 2000
  gemini_ragas_embedding_requests_per_minute: 200
