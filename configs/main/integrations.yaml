integrations:
  discord:
    bot_token: ""
  openclaw:
    enabled: false
    agent: "main"
    model: "openai/gpt-5.4"
    lite_agent: "lite"
    lite_model: "google/gemini-3-flash-preview"
    config_dir: "configs/openclaw"
  drive:
    folder_id: ""
    google_application_credentials: ""
    max_files: 0
    batch_size: 20
    download_max_retries: 3
    download_retry_initial_delay_seconds: 0.5
    download_retry_max_delay_seconds: 8.0
    download_retry_backoff_multiplier: 2.0
    pdf_ocr_model_path: "model/ocr/PaddlePaddle/PP-OCRv5_mobile"
  crafters_colony:
    author_url: ""
    max_pages: 100
    max_articles: 0
  hatenablog:
    blog_url: ""
  notion:
    api_token: ""
    database_ids: []
  minecraft_wiki:
    page_titles: []
    api_url: "https://ja.minecraft.wiki/api.php"
    page_url_base: "https://ja.minecraft.wiki/w/"
    acquisition_mode: "configured"
    max_pages: 0
    rate_limit_per_minute: 120
    request_interval_seconds: 1.0
    namespaces: [0]
    full_backfill_enabled: false
    category_sample:
      per_category_limit: 20
      categories:
        blocks: "カテゴリ:ブロック"
        items: "カテゴリ:アイテム"
        mobs: "カテゴリ:Mob"
        biomes: "カテゴリ:バイオーム"
        enchantments: "カテゴリ:エンチャント"
        commands: "カテゴリ:コマンド"
        recipes: "カテゴリ:レシピ"
    quality_gate:
      enabled: true
      min_article_characters: 500
      max_redirect_ratio: 0.2
      min_indexable_pages: 1
      min_chunk_count: 1
      required_canonical_host: "ja.minecraft.wiki"
      policy: "warn"
  openai_api_key: ""
  gemini_api_key: ""
  gemini_requests_per_minute: 1000
  gemini_embedding_requests_per_minute: 100
  gemini_summary_requests_per_minute: 2000
  gemini_ragas_requests_per_minute: 2000
  gemini_ragas_embedding_requests_per_minute: 200
