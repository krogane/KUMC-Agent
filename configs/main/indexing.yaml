indexing:
  chunking:
    first_recursive_chunk_size: 1024
    first_recursive_chunk_overlap: 128
    second_recursive_chunk_size: 384
    second_recursive_chunk_overlap: 64
    summary_characters: 200
    summary_batch_size: 2000
    summary_llm_provider: "gemini"
    summary_gemini_model: "gemini-2.5-flash-lite"
    summary_temperature: 0.0
    summary_max_output_tokens: 1024
    summary_thinking_level: "minimal"
  stages:
    second_recursive_enabled: true
    sparse_second_recursive_enabled: true
    summary_enabled: true
  refresh:
    clear_ingestion_source_data: false
    clear_first_recursive_chunk_data: false
    clear_second_recursive_chunk_data: false
    clear_summary_chunk_data: false
    update_ingestion_source_data: true
    update_first_recursive_chunk_data: true
    update_second_recursive_chunk_data: true
    update_sparse_second_recursive_chunk_data: true
    update_summary_chunk_data: true

