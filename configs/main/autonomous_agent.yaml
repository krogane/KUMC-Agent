autonomous_agent:
  enabled: false
  schedule_times: ["08:00", "13:00", "20:00"]
  timezone: "Asia/Tokyo"
  scopes: ["tasks", "events", "rag_delta", "server_ops", "automation"]
  notification_channel_id: ""
  dry_run: true
  lookahead_days:
    tasks: 2
    events: 7
  duplicate_suppression_hours: 24
  # Deprecated: RAG delta extraction now uses workflow_extraction.lookback_days.
  rag_delta_lookback_hours: 24
  access:
    system_user_id: "system"
    guild_id: ""
    role_ids: []
    is_admin: false
  planner:
    enabled: true
    provider: "gemini"
    gemini_model: ""
    openai_model: "gpt-5.2"
    prompt_name: "autonomous_agent_planner"
    temperature: 0.0
    max_output_tokens: 2048
    max_retries: 2
  verifier:
    enabled: true
    provider: "gemini"
    gemini_model: ""
    openai_model: "gpt-5.2"
    prompt_name: "autonomous_agent_verifier"
    temperature: 0.0
    max_output_tokens: 2048
    max_retries: 2
  budget:
    max_steps: 10
    max_search_calls: 6
    max_replans: 1
    max_cost_usd: 0.50
    max_latency_seconds: 120
